# .github/workflows/mirror-putty-ranvis.yml
name: Mirror PuTTY-ranvis

on:
  schedule:
    - cron: '0 */2 * * *'   # 二時間ごとに実行
  workflow_dispatch:

permissions:
  contents: write          # リリース作成・アセットアップロードに必要

jobs:
  mirror:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run mirror & update script
        shell: pwsh
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/update-putty-ranvis.ps1

      - name: Commit manifest changes
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/putty-ranvis.json
          if (-not (git diff --cached --quiet; $LASTEXITCODE -eq 0)) {
            git commit -m "Update putty-ranvis manifest (mirror)"
            git push
          }
