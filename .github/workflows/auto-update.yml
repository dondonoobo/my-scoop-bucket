name: Auto Update Scoop Manifests

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  update-manifests:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Scoop Environment
        shell: powershell
        run: |
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          echo "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run Update Script
        shell: powershell
        run: |
          .\Update-ScoopManifests.ps1

      - name: Commit and Push Changes
        shell: powershell
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add bucket/*.json
          if (Test-Path "bucket/update_log.txt") { git add bucket/update_log.txt }
          
          $status = git status --porcelain
          if ($status) {
              git commit -m "chore: auto-update manifests and logs [skip ci]"
              git push
          } else {
              Write-Host "No changes detected. Skip commit."
          }